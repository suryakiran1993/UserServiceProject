spring.application.name=UserService

server.port = 8001

# PostgreSQL Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/userdb
spring.datasource.username=postgres
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


eureka.instance.appname=user-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

management.info.env.enabled=true
management.endpoints.web.exposure.include=*

info.name = User-Service
info.app.description = User Service Project
info.app.author=J Surya Kiran
info.app.version = 1.0


# ================================
# Resilience4j Circuit Breaker
# ================================

resilience4j.circuitbreaker.instances.ProductService.register-health-indicator=true
resilience4j.circuitbreaker.instances.ProductService.sliding-window-size=5
resilience4j.circuitbreaker.instances.ProductService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ProductService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ProductService.permitted-number-of-calls-in-half-open-state=2


# ================================
# Debug Logging
# ================================

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.circuitbreaker.internal.CircuitBreakerStateMachine=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG


# jwt configuration

jwt.secret=mysecretkeymysecretkeymysecretkeymysecretkey123
jwt.expiration=3600000
















